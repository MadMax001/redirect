#   DOCKER_HOST: tcp://docker:2376
#   DOCKER_TLS_CERTDIR: "/certs"
#   DOCKER_TLS_VERIFY: "1"
#   DOCKER_CERT_PATH: "/certs/client"


variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  CI_REGISTRY_IMAGE: redirect
  
stages:
  - build
  - test
  - docker-build


image: gradle:8.14-jdk21-alpine

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build:
  stage: build
  script: gradle build --no-daemon -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

test:
  stage: test
  before_script:
    - apk add --no-cache docker docker-compose
  script: gradle check
  artifacts:
    when: always
    paths:
      - build/reports/tests/
    expire_in: 1 hour
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  dependencies:
    - build
  when: manual
  allow_failure: true

docker-build:
  stage: docker-build
  image: docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  dependencies:
    - build
  #  - test
  only:
    - main
    - master
    - develop
